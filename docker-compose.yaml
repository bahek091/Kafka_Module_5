services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - confluent
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    networks:
      - confluent
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    volumes:
      - ./certificates/brokers/kafka-1:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Оба листенера SSL: INTERNAL_SSL - межброкерный трафик и клиенты внутри docker-сети,
      # EXTERNAL_SSL - клиенты с хоста. PLAINTEXT-листенера нет.
      # Суффикс _SSL в именах обязателен: образ cp-kafka подключает KAFKA_SSL_* только если
      # в KAFKA_ADVERTISED_LISTENERS есть подстрока "SSL://".
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9092,EXTERNAL_SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-1:9092,EXTERNAL_SSL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

      KAFKA_SSL_KEYSTORE_FILENAME: kafka.server.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore.password
      KAFKA_SSL_KEY_CREDENTIALS: key.password
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore.password

      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # Суперпользователи: брокеры (межброкерный SSL) и администратор. Клиенты работают только по ACL.
      KAFKA_SUPER_USERS: "User:CN=kafka-1,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-2,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-3,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-admin,L=Moscow,OU=Practice,O=Yandex,C=RU"

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    networks:
      - confluent
    depends_on:
      - zookeeper
    ports:
      - "9094:9093"
    volumes:
      - ./certificates/brokers/kafka-2:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Оба листенера SSL: INTERNAL_SSL - межброкерный трафик и клиенты внутри docker-сети,
      # EXTERNAL_SSL - клиенты с хоста. PLAINTEXT-листенера нет.
      # Суффикс _SSL в именах обязателен: образ cp-kafka подключает KAFKA_SSL_* только если
      # в KAFKA_ADVERTISED_LISTENERS есть подстрока "SSL://".
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9092,EXTERNAL_SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-2:9092,EXTERNAL_SSL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

      KAFKA_SSL_KEYSTORE_FILENAME: kafka.server.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore.password
      KAFKA_SSL_KEY_CREDENTIALS: key.password
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore.password

      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # Суперпользователи: брокеры (межброкерный SSL) и администратор. Клиенты работают только по ACL.
      KAFKA_SUPER_USERS: "User:CN=kafka-1,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-2,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-3,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-admin,L=Moscow,OU=Practice,O=Yandex,C=RU"

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    networks:
      - confluent
    depends_on:
      - zookeeper
    ports:
      - "9095:9093"
    volumes:
      - ./certificates/brokers/kafka-3:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Оба листенера SSL: INTERNAL_SSL - межброкерный трафик и клиенты внутри docker-сети,
      # EXTERNAL_SSL - клиенты с хоста. PLAINTEXT-листенера нет.
      # Суффикс _SSL в именах обязателен: образ cp-kafka подключает KAFKA_SSL_* только если
      # в KAFKA_ADVERTISED_LISTENERS есть подстрока "SSL://".
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9092,EXTERNAL_SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-3:9092,EXTERNAL_SSL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

      KAFKA_SSL_KEYSTORE_FILENAME: kafka.server.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore.password
      KAFKA_SSL_KEY_CREDENTIALS: key.password
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore.password

      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # Суперпользователи: брокеры (межброкерный SSL) и администратор. Клиенты работают только по ACL.
      KAFKA_SUPER_USERS: "User:CN=kafka-1,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-2,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-3,L=Moscow,OU=Practice,O=Yandex,C=RU;User:CN=kafka-admin,L=Moscow,OU=Practice,O=Yandex,C=RU"

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  # Служебный контейнер с Kafka CLI для setup-acl.sh (запускается только через `docker compose run`).
  kafka-cli:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-cli
    profiles:
      - tools
    networks:
      - confluent
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    volumes:
      - ./certificates/clients:/etc/kafka/clients:ro
      - ./setup-acl.sh:/opt/setup/setup-acl.sh:ro
    entrypoint: ["bash", "/opt/setup/setup-acl.sh"]

networks:
  confluent:
    driver: bridge